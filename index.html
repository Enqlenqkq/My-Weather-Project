<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--Favicon-->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌤️</text></svg>"
    />
    <!--Default Background-->
    <link rel="preload" as="image" href="./images/backgrounds/default.jpg" />
    <!--Title-->
    <title>Weather Project</title>
    <!--CSS Import-->
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <header class="hero-section">
      <nav class="navbar">
        <a href="https://my-weather-project-v.vercel.app/" class="card-link">
          <div class="title-logo">
            <img src="./images/logo_no_bg.png" alt="로고" />
            <span>나만의 <strong>날씨</strong> 앱</span>
          </div>
        </a>

        <div class="nav-right">
          <ul class="desktop-menu">
            <li><a href="#">홈</a></li>
            <li><a href="#">날씨 지도</a></li>
            <li><a href="#">설정</a></li>
          </ul>

          <div class="toggle-wrapper">
            <input type="checkbox" id="unitToggle" class="toggle-input" />
            <label for="unitToggle" class="toggle-label">
              <span class="toggle-ball"></span>
              <span class="label-text c">°C</span>
              <span class="label-text f">°F</span>
            </label>
          </div>

          <button class="hamburger-btn" aria-label="메뉴 열기">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
        </div>

        <div class="mobile-menu" id="mobileMenu">
          <button class="close-btn" id="closeMenuBtn" aria-label="메뉴 닫기">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="30"
              height="30"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
          <a href="#">홈</a>
          <a href="#">날씨 지도</a>
          <a href="#">설정</a>
        </div>
      </nav>

      <div class="hero-content">
        <h1 class="hero-title">어느 도시의 날씨가 궁금하신가요?</h1>
        <div class="search-box">
          <input
            type="text"
            id="cityInput"
            placeholder="도시 이름을 입력하세요. (예: Seoul, London)"
          />
          <button id="clearBtn" type="button" style="display: none">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
          <button id="searchBtn">
            <!-- 돋보기 아이콘 (SVG) -->
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>
        </div>
        <div id="history-container" class="history-container"></div>
      </div>
    </header>

    <!-- 메인 컨텐츠 (날씨 결과 표시) -->
    <main class="container">
      <!-- 현재 날씨 카드 -->
      <div id="weather-result">
        <!-- 초기 안내 문구는 JS가 데이터를 받으면 사라집니다 -->
        <div class="empty-state">
          <p>도시를 검색하여 날씨를 확인해보세요.</p>
        </div>
      </div>

      <!-- 5일 예보 카드 영역 -->
      <div id="forecast-result" class="forecast-container"></div>
    </main>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
